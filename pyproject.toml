[project]
name = "umami-mcp"
version = "0.1.0"
description = "Read-only MCP server for Umami website analytics"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Kenneth Reitz", email = "me@kennethreitz.org" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "mcp[cli]>=2.3,<3",
    "tzdata>=2025.1",
    "uvicorn>=0.32",
]

[project.urls]
Repository = "https://github.com/kennethreitz/umami-mcp"
Homepage = "https://github.com/kennethreitz/umami-mcp"

[project.scripts]
umami-mcp = "umami_mcp.main:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "respx>=0.22",
]
